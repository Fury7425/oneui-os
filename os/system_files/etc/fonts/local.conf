<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Same fonts for GTK and Flatpak apps as for Plasma: Pretendard (Latin + Hangul), JetBrains Mono. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Pretendard Variable</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
</fontconfig>
