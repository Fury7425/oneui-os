# Plasma Login Manager distro defaults (Fedora 44 replaced SDDM with it). /etc/plasmalogin.conf overrides these.
# Login screen on the OneUI OS wallpaper, same as the lock screen (kscreenlockerrc).
[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/OneUIOS/
