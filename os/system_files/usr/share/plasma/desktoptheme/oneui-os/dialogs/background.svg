<?xml version="1.0" encoding="UTF-8"?>
<!-- Popups and notifications: the guide's floating glass. 32 px corners, view colour at 62 % (white in light), a 1 px light
     edge inside the top, 14 px padding. -->
<!-- Each segment: glass fill (Window colour) plus a 1 px edge (text colour at 12 %, the guide's line token).
     Class and fill sit on every shape: QtSvg does not pass the colour class from a group down to its children.
     mask-* give Plasma the exact shape for blur and the visible region; without them floating panels stay
     hidden at login (Plasma 6.6, seen in a F44 VM). No double hyphen in comments: it breaks the XML. -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="70" viewBox="0 0 200 70">
  <style id="current-color-scheme">.ColorScheme-ViewBackground { color:#ffffff; } .ColorScheme-Text { color:#18181e; }</style>
  <g id="topleft"><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" d="M0,32 A32,32 0 0 1 32,0 L32,32 Z"/><path class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" d="M0,32 A32,32 0 0 1 32,0 L32,1 A31,31 0 0 0 1,32 Z"/><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.75" d="M1,32 A31,31 0 0 1 32,1 L32,2 A31,30 0 0 0 1,32 Z"/></g>
  <g id="top"><rect class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" x="32" y="0" width="4" height="32"/><rect class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" x="32" y="0" width="4" height="1"/><rect class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.75" x="32" y="1" width="4" height="1"/></g>
  <g id="topright"><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" d="M36,0 A32,32 0 0 1 68,32 L36,32 Z"/><path class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" d="M36,0 A32,32 0 0 1 68,32 L67,32 A31,31 0 0 0 36,1 Z"/><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.75" d="M36,1 A31,31 0 0 1 67,32 A31,30 0 0 0 36,2 Z"/></g>
  <g id="left"><rect class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" x="0" y="32" width="32" height="4"/><rect class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" x="0" y="32" width="1" height="4"/></g>
  <rect id="center" class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" x="32" y="32" width="4" height="4"/>
  <g id="right"><rect class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" x="36" y="32" width="32" height="4"/><rect class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" x="67" y="32" width="1" height="4"/></g>
  <g id="bottomleft"><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" d="M0,36 L32,36 L32,68 A32,32 0 0 1 0,36 Z"/><path class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" d="M0,36 L1,36 A31,31 0 0 0 32,67 L32,68 A32,32 0 0 1 0,36 Z"/></g>
  <g id="bottom"><rect class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" x="32" y="36" width="4" height="32"/><rect class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" x="32" y="67" width="4" height="1"/></g>
  <g id="bottomright"><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" d="M36,36 L68,36 A32,32 0 0 1 36,68 Z"/><path class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" d="M68,36 A32,32 0 0 1 36,68 L36,67 A31,31 0 0 0 67,36 Z"/></g>
  <g fill="#000000">
    <path id="mask-topleft" d="M80,32 A32,32 0 0 1 112,0 L112,32 Z"/>
    <rect id="mask-top" x="112" y="0" width="4" height="32"/>
    <path id="mask-topright" d="M116,0 A32,32 0 0 1 148,32 L116,32 Z"/>
    <rect id="mask-left" x="80" y="32" width="32" height="4"/>
    <rect id="mask-center" x="112" y="32" width="4" height="4"/>
    <rect id="mask-right" x="116" y="32" width="32" height="4"/>
    <path id="mask-bottomleft" d="M80,36 L112,36 L112,68 A32,32 0 0 1 80,36 Z"/>
    <rect id="mask-bottom" x="112" y="36" width="4" height="32"/>
    <path id="mask-bottomright" d="M116,36 L148,36 A32,32 0 0 1 116,68 Z"/>
  </g>
  <g fill="#ff00ff">
    <rect id="hint-left-margin" x="160" y="0" width="14" height="2"/>
    <rect id="hint-right-margin" x="160" y="4" width="14" height="2"/>
    <rect id="hint-top-margin" x="180" y="0" width="2" height="14"/>
    <rect id="hint-bottom-margin" x="184" y="0" width="2" height="14"/>
  </g>
</svg>
