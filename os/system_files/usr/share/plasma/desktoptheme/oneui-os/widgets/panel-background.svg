<?xml version="1.0" encoding="UTF-8"?>
<!-- Taskbar pill, the guide's floating glass: 28 px corners (half the 56 px panel), view colour at 62 % (white in light), a 1 px
     light edge inside the top (box-shadow 0 1px 0 inset), 12/9 px padding, 12 px from the screen edges. -->
<!-- Each segment: glass fill (Window colour) plus a 1 px edge (text colour at 12 %, the mockup line token).
     Class and fill sit on every shape: QtSvg does not pass the colour class from a group down to its children.
     mask-* give Plasma the exact shape for blur and the visible region; without them floating panels stay
     hidden at login (Plasma 6.6, seen in a F44 VM). No double hyphen in comments: it breaks the XML. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="210" viewBox="0 0 200 210">
  <style id="current-color-scheme">.ColorScheme-ViewBackground { color:#ffffff; } .ColorScheme-Text { color:#18181e; }</style>
  <g id="topleft"><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" d="M0,28 A28,28 0 0 1 28,0 L28,28 Z"/><path class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" d="M0,28 A28,28 0 0 1 28,0 L28,1 A27,27 0 0 0 1,28 Z"/><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.75" d="M1,28 A27,27 0 0 1 28,1 L28,2 A27,26 0 0 0 1,28 Z"/></g>
  <g id="top"><rect class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" x="28" y="0" width="4" height="28"/><rect class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" x="28" y="0" width="4" height="1"/><rect class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.75" x="28" y="1" width="4" height="1"/></g>
  <g id="topright"><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" d="M32,0 A28,28 0 0 1 60,28 L32,28 Z"/><path class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" d="M32,0 A28,28 0 0 1 60,28 L59,28 A27,27 0 0 0 32,1 Z"/><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.75" d="M32,1 A27,27 0 0 1 59,28 A27,26 0 0 0 32,2 Z"/></g>
  <g id="left"><rect class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" x="0" y="28" width="28" height="4"/><rect class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" x="0" y="28" width="1" height="4"/></g>
  <rect id="center" class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" x="28" y="28" width="4" height="4"/>
  <g id="right"><rect class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" x="32" y="28" width="28" height="4"/><rect class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" x="59" y="28" width="1" height="4"/></g>
  <g id="bottomleft"><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" d="M0,32 L28,32 L28,60 A28,28 0 0 1 0,32 Z"/><path class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" d="M0,32 L1,32 A27,27 0 0 0 28,59 L28,60 A28,28 0 0 1 0,32 Z"/></g>
  <g id="bottom"><rect class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" x="28" y="32" width="4" height="28"/><rect class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" x="28" y="59" width="4" height="1"/></g>
  <g id="bottomright"><path class="ColorScheme-ViewBackground" style="fill:currentColor;fill-opacity:0.62" d="M32,32 L60,32 A28,28 0 0 1 32,60 Z"/><path class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.12" d="M60,32 A28,28 0 0 1 32,60 L32,59 A27,27 0 0 0 59,32 Z"/></g>
  <g fill="#000000">
    <path id="mask-topleft" d="M70,28 A28,28 0 0 1 98,0 L98,28 Z"/>
    <rect id="mask-top" x="98" y="0" width="4" height="28"/>
    <path id="mask-topright" d="M102,0 A28,28 0 0 1 130,28 L102,28 Z"/>
    <rect id="mask-left" x="70" y="28" width="28" height="4"/>
    <rect id="mask-center" x="98" y="28" width="4" height="4"/>
    <rect id="mask-right" x="102" y="28" width="28" height="4"/>
    <path id="mask-bottomleft" d="M70,32 L98,32 L98,60 A28,28 0 0 1 70,32 Z"/>
    <rect id="mask-bottom" x="98" y="32" width="4" height="28"/>
    <path id="mask-bottomright" d="M102,32 L130,32 A28,28 0 0 1 102,60 Z"/>
  </g>
  <!-- floating-*: only the hint margins matter; Plasma uses them as the gap between a floating pill and the screen edge (12 px, the guide's gap) -->
  <g fill="none">
    <rect id="floating-topleft" x="140" y="20" width="2" height="2"/><rect id="floating-top" x="142" y="20" width="2" height="2"/><rect id="floating-topright" x="144" y="20" width="2" height="2"/>
    <rect id="floating-left" x="140" y="22" width="2" height="2"/><rect id="floating-center" x="142" y="22" width="2" height="2"/><rect id="floating-right" x="144" y="22" width="2" height="2"/>
    <rect id="floating-bottomleft" x="140" y="24" width="2" height="2"/><rect id="floating-bottom" x="142" y="24" width="2" height="2"/><rect id="floating-bottomright" x="144" y="24" width="2" height="2"/>
  </g>
  <g fill="#ff00ff">
    <rect id="floating-hint-left-margin" x="150" y="20" width="12" height="2"/>
    <rect id="floating-hint-right-margin" x="150" y="24" width="12" height="2"/>
    <rect id="floating-hint-top-margin" x="166" y="20" width="2" height="12"/>
    <rect id="floating-hint-bottom-margin" x="170" y="20" width="2" height="12"/>
  </g>
  <g fill="#ff00ff">
    <rect id="hint-left-margin" x="140" y="0" width="12" height="2"/>
    <rect id="hint-right-margin" x="140" y="4" width="12" height="2"/>
    <rect id="hint-top-margin" x="170" y="0" width="2" height="9"/>
    <rect id="hint-bottom-margin" x="174" y="0" width="2" height="9"/>
  </g>
  <!-- shadow-*: the guide's pill shadow (0 14px 36px, spread -14px, 30 %) as PNG tiles, with the pill itself cut away
       as CSS does. Made by os/test/panel-shadow.py (run it where Pillow is installed, paste its output here). -->
  <image id="shadow-topleft" x="0" y="100" width="54" height="36" xlink:href="data:image/png;base64,"/>
  <image id="shadow-top" x="60" y="100" width="1" height="8" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAAICAYAAAA4GpVBAAAAFklEQVR42mNwsghiYmJgYGCAE4zYuAAf2wDfK39R2wAAAABJRU5ErkJggg=="/>
  <image id="shadow-topright" x="70" y="100" width="54" height="36" xlink:href="data:image/png;base64,"/>
  <image id="shadow-left" x="130" y="100" width="26" height="1" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABoAAAABCAYAAADAW76WAAAAHElEQVR42mN0sghiQAOMDLgBIwExbGxGBgYGBgBTtADUx4V2OQAAAABJRU5ErkJggg=="/>
  <image id="shadow-right" x="160" y="100" width="26" height="1" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABoAAAABCAYAAADAW76WAAAAH0lEQVR42mN0sghiYWBgYGJgYPjPAAEwGh8bnxhWeQC90QbOZWD/ewAAAABJRU5ErkJggg=="/>
  <image id="shadow-bottomleft" x="0" y="140" width="54" height="68" xlink:href="data:image/png;base64,"/>
  <image id="shadow-bottom" x="60" y="140" width="1" height="40" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAAoCAYAAAA/tpB3AAAALklEQVR42mNwsgiSYGJgYOBkYmBg+MvEwMDwHxfxj2QJbAQDYTEGVDEGvBIQAgBKvB0cxfoahQAAAABJRU5ErkJggg=="/>
  <image id="shadow-bottomright" x="70" y="140" width="54" height="68" xlink:href="data:image/png;base64,"/>
  <g fill="#ff00ff">
    <rect id="shadow-hint-top-margin" x="140" y="120" width="2" height="8"/>
    <rect id="shadow-hint-bottom-margin" x="144" y="120" width="2" height="40"/>
    <rect id="shadow-hint-left-margin" x="150" y="120" width="26" height="2"/>
    <rect id="shadow-hint-right-margin" x="150" y="124" width="26" height="2"/>
  </g>
</svg>
