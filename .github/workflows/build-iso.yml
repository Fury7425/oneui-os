name: Build ISO

# A live USB built from the published image by titanoboa: it boots into One UI and opens the One UI installer
# (os/system_files/usr/libexec/oneui-installer), which installs the copy of the image the USB carries.
# The image package on ghcr.io has to be public: the live build pulls it without credentials, and installed
# laptops update from it the same way.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: extractions/setup-just@v3

      - name: Build the live USB
        run: |
          set -euo pipefail
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oneui-os:latest"
          hook="${RUNNER_TEMP}/live-hook.sh"
          sed "s|@IMAGE_REF@|${IMAGE_REF}|" os/installer/live-hook.sh > "$hook"

          # titanoboa pulls as root; log root's podman in so a private package still pulls here.
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Same titanoboa revision Bluefin builds with.
          boa="${RUNNER_TEMP}/titanoboa"
          git clone --quiet https://github.com/ublue-os/titanoboa "$boa"
          git -C "$boa" checkout --quiet 840217d97bd0bc9a52466508c54d8dda5c5ba2fd
          sed -i '1a set lists' "$boa/Justfile" # newer just needs this for the Justfile's which()

          # build <image> <livesys> <flatpaks> <compression> <kargs> <image to carry> <polkit>
          # No flatpaks on the USB: installs fetch theirs on first boot (oneui-os-flatpaks.service).
          sudo env PATH="$PATH" CI="$CI" HOOK_post_rootfs="$hook" \
              "$(command -v just)" -f "$boa/Justfile" build "$IMAGE_REF" 1 none squashfs NONE "$IMAGE_REF" 1
          sudo chown "$(id -u):$(id -g)" "$boa/output.iso"
          mkdir -p out && mv "$boa/output.iso" out/oneui-1.0-x86_64.iso

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oneui-iso
          path: out
          if-no-files-found: error
          compression-level: 0
