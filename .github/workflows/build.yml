name: Build image

on:
  push:
    branches: [main]
    paths: ["os/**", ".github/workflows/build.yml"]
  schedule:
    - cron: "20 4 * * *" # daily, so installs get Fedora and KDE updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build
        env:
          MOK_KEY: ${{ secrets.MOK_KEY }}
        run: |
          printf '%s' "$MOK_KEY" > "$RUNNER_TEMP/mok.key"
          podman build --pull=newer --secret id=mok_key,src="$RUNNER_TEMP/mok.key" -t oneui-os:latest os/
          rm "$RUNNER_TEMP/mok.key"

      - name: Push to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push oneui-os:latest "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oneui-os:latest"
